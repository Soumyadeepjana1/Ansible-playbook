---
- name: create file
  hosts: all
  become: yes
  become_user: root
  tasks:
    - name: create file
      file: 
        path: /home/ubuntu/ansiblepractice/ansible-file-task-1.txt
        state: touch
        mode: '0777'

    - name: create directory
      ansible.builtin.file:
        path: /home/ubuntu/ansiblepractice/ansible-demo
        state: directory
        mode: '0755'          
